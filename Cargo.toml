[package]
name = "phosphor-svgs"
description = "Autogenerated Phosphor Icons SVGs as `const &str`s"
version = "0.5.0"
edition = "2021"
rust-version = "1.56"
authors = ["Meadowsys <meadowsys@kiwin.gay>"]
repository = "https://github.com/meadowsys/phosphor-svgs"
license = "MIT"
include = [
	"src",
	"phosphor-core/assets",
	"!phosphor-core/src"
]

[dependencies]
leptos = { version = "0.8", package = "leptos", default-features = false, optional = true }

[features]
default = ["str"]

leptos-0-8 = [
	"dep:leptos"
]
str = []

[package.metadata.docs.rs]
rustdoc-args = [
	"--cfg",
	"docsrs"
]
features = [
	"leptos-0-8",
	"str"
]
targets = [
	"aarch64-apple-darwin"
]

[workspace]
resolver = "2"
members = [
	"scripts"
]
