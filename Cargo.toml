[package]
name = "phosphor-svgs"
description = "Autogenerated Phosphor Icons SVGs as `const &str`s"
version = "0.3.0"
edition = "2021"
rust-version = "1.56"
authors = ["Meadowsys <meadowsys@kiwin.gay>"]
repository = "https://github.com/meadowsys/phosphor-svgs"
license = "MIT"
include = [
	"src",
	"phosphor-core/assets",
	"!phosphor-core/src"
]

[workspace]
resolver = "2"
members = [
	"scripts"
]
